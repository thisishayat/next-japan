apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjapan-deployment
  labels:
    app: nextjapan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjapan
  template:
    metadata:
      labels:
        app: nextjapan
    spec:
      containers:
        - name: nextjapan
          image: thisishayat/next-japan:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
