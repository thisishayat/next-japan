name: Hayat-assignment-mode-7

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # (1) Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # (2) Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # (3) Install dependencies
      - name: Install dependencies
        run: npm ci

      # (4) Lint and test (if test script exists)
      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      # (5) Build the Next.js app
      - name: Build Next.js app
        run: npm run build

      # (6) Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ github.repository }}:latest .

      # (7) Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # (8) Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          IMAGE=${{ github.repository }}
          docker tag $IMAGE:latest ${{ secrets.DOCKER_USERNAME }}/next-japan:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/next-japan:latest
